[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "contracts/test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./lib/contracts" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
bsc = "${BSC_RPC}"
bsc_testnet = "${BSC_TESTNET_RPC}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api" }
