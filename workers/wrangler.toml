name = "hotshort-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# 与前端共用 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "hotshort"
database_id = "30a260d1-6324-45ff-871e-8a6eff555b5f"
migrations_dir = "migrations"

[vars]
CHAIN_ID = "56"
VAULT_ADDRESS = "0xbB944C054610bD660750065b5d0Bd4bc7156BED6"
HS_TOKEN = "0xcf4907621f0d9803c7288423b4303226b696b533"
USDT_TOKEN = "0x55d398326f99059ff775485246999027b3197955"
PANCAKE_PAIR = "0x2398e858ac6ad9dea4496bc6ecacea4ce77cc67e"
PANCAKE_LOTTERY_ADDRESS = ""

# 开发用本地变量见 .dev.vars（不入版本库）
# Secrets 通过 `wrangler secret put SIGNER_PRIVATE_KEY / JWT_SECRET / BSCSCAN_API_KEY` 设置

[triggers]
crons = [
  "* * * * *",     # 每分钟：拉 Vault 事件 → D1
  "0 0 * * *",     # 每日 UTC 00:00（北京时间 08:00）：股票分红结算
  "0 16 * * SUN",  # 每周日 UTC 16:00（北京时间周一 00:00）：彩票开奖 + 燃烧周榜结算
]

[observability]
enabled = true
