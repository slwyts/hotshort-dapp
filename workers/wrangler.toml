name = "hotshort-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 与前端共用 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "hotshort"
database_id = "30a260d1-6324-45ff-871e-8a6eff555b5f"
migrations_dir = "migrations"

[vars]
CHAIN_ID = "56"
CHAIN_NAME = "BNB Smart Chain"
RPC_URL = "https://bsc-mainnet.nodereal.io/v1/d4b51dc9355541a1b4612a6ad4326d17"
BLOCK_EXPLORER_URL = "https://bscscan.com"
NATIVE_CURRENCY_NAME = "BNB"
NATIVE_CURRENCY_SYMBOL = "BNB"
VAULT_ADDRESS = "0xC96377982605fcB0f8B7953C8E11E843567d8c18"
HS_TOKEN = "0xcf4907621f0d9803c7288423b4303226b696b533"
USDT_TOKEN = "0x55d398326f99059ff775485246999027b3197955"
PANCAKE_PAIR = "0x2398e858ac6ad9dea4496bc6ecacea4ce77cc67e"
# HS 旧合约登记的 LP 持有人。仅该钱包转入 Vault 的 USDT 会计作 §4.1 LP 交易分红。
LP_DIVIDEND_SOURCE_ADDRESS = "0xC6F527B6E0C413E63B8AfbD828Fdd3219Efcc459"
# 索引器只处理距链头至少 12 个区块的日志，降低短重组导致错误入账的风险。
INDEXER_CONFIRMATIONS = "12"
PANCAKE_LOTTERY_ADDRESS = "0x5aF6D33DE2ccEC94efb1bDF8f92Bd58085432d2c"
STOCK_QUOTE_MODE = "auto"

# 开发用本地变量见 .dev.vars（不入版本库）
# Secrets 通过 `wrangler secret put SIGNER_PRIVATE_KEY / JWT_SECRET / BSCSCAN_API_KEY` 设置

[triggers]
crons = [
  "* * * * *",     # 每分钟统一触发；具体任务节奏在 src/cron.ts 内按真实 UTC 时间判断
]

[observability]
enabled = true
